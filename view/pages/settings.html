<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>设置 | 人工智能开发助手</title>
  <link rel="stylesheet" href="/static/css/style.css" />
</head>
<body data-page="settings">
  <div class="app-shell">
    <aside class="sidebar">
      <a class="brand" href="/index.html"><span class="brand-mark">智</span><span class="brand-copy"><span class="brand-title">人工智能开发助手</span><span class="brand-subtitle">开发知识工作台</span></span></a>
      <div class="workspace-switcher"><span class="workspace-name">开发知识库</span><span class="workspace-status" title="系统运行正常"></span></div>
      <p class="nav-label">工作区</p>
      <nav class="nav-list" aria-label="主导航">
        <a class="nav-link" data-nav="chat" href="/chat.html"><span class="nav-icon">聊</span><span>对话</span></a>
        <a class="nav-link" data-nav="knowledge" href="/knowledge.html"><span class="nav-icon">知</span><span>知识库</span></a>
        <a class="nav-link" data-nav="documents" href="/documents.html"><span class="nav-icon">文</span><span>文档</span></a>
        <a class="nav-link" data-nav="review" href="/review.html"><span class="nav-icon">审</span><span>审核</span></a>
        <a class="nav-link" data-nav="settings" href="/settings.html"><span class="nav-icon">设</span><span>设置</span></a>
      </nav>
      <div class="sidebar-spacer"></div><div class="sidebar-footer"><div class="system-status">系统运行正常</div><div class="user-row"><span class="avatar">本</span><span>本地工作区</span></div></div>
    </aside>
    <main class="main">
      <header class="topbar"><div class="topbar-left"><button class="mobile-menu" type="button" data-menu-toggle aria-label="打开导航">=</button><div class="breadcrumb"><strong>工作区</strong><span> / 设置</span></div></div><div class="topbar-right"><span class="topbar-status">配置视图</span></div></header>
      <div class="page">
        <section class="page-heading"><div><div class="eyebrow">工作区配置</div><h1>设置</h1><p class="lead">查看当前模型、向量库和运行环境配置。敏感配置仍由服务端环境变量管理。</p></div></section>
        <div class="two-column">
          <section class="panel">
            <div class="panel-title"><h2>模型配置</h2><span>只读</span></div>
            <div class="field-grid-form">
              <div class="field"><label for="chat-provider">对话模型服务</label><input id="chat-provider" value="开放接口兼容模式" readonly /></div>
              <div class="field"><label for="chat-model">对话模型</label><input id="chat-model" value="deepseek-v4-flash" readonly /></div>
              <div class="field"><label for="embedding-model">向量模型</label><input id="embedding-model" value="BAAI/bge-m3" readonly /></div>
              <div class="field"><label for="temperature">生成温度</label><input id="temperature" value="0.2" readonly /></div>
            </div>
          </section>
          <section class="panel">
            <div class="panel-title"><h2>系统信息</h2><span>运行时</span></div>
            <div class="status-line"><span class="status-name">运行环境</span><span class="status-value">law_rag</span></div>
            <div class="status-line"><span class="status-name">接口地址</span><span class="status-value">192.168.1.229:8000</span></div>
            <div class="status-line"><span class="status-name">向量数据库</span><span class="status-value online">已连接</span></div>
            <div class="status-line"><span class="status-name">问答链路</span><span class="status-value online">已就绪</span></div>
          </section>
        </div>
        <section class="panel" style="margin-top:16px;">
          <div class="panel-title"><h2>功能开关</h2><span>当前版本</span></div>
          <div class="status-line"><span class="status-name">基础检索</span><span class="tag cyan">已启用</span></div>
          <div class="status-line"><span class="status-name">重排序模型</span><span class="tag">已预留</span></div>
          <div class="status-line"><span class="status-name">混合检索</span><span class="tag">已预留</span></div>
          <div class="status-line"><span class="status-name">智能体工具</span><span class="tag amber">已准备</span></div>
        </section>
      </div>
    </main>
  </div>
  <div class="toast" data-toast></div>
  <script src="/static/js/app.js"></script>
</body>
</html>
